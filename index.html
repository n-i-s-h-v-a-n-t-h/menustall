<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Live menu — see what's fresh, what's available and prices. Order & pay at the counter.">
  <meta name="theme-color" content="#FFF8EE">
  <title>Menu</title>
  <script>
    // Apply the saved theme before first paint (avoids a flash).
    try { var t = localStorage.getItem('chaimenu:theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%98%95%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="modulepreload" href="js/menu/app.js">
  <link rel="modulepreload" href="js/lib/supabase.js">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/menu.css">
</head>
<body class="menu-page is-loading">
  <a class="skip-link" href="#menu">Skip to menu</a>

  <header class="hero" role="banner">
    <svg class="steam" viewBox="0 0 120 120" aria-hidden="true" focusable="false">
      <path d="M40 100c-12-14 14-22 2-38s10-26 2-42" />
      <path d="M62 100c-12-14 14-22 2-38s10-26 2-42" />
      <path d="M84 100c-12-14 14-22 2-38s10-26 2-42" />
    </svg>
    <div class="hero-inner">
      <div class="hero-top">
        <div class="hero-logo" id="shop-logo" aria-hidden="true">☕</div>
        <div class="hero-actions">
          <span class="table-chip" id="table-chip" hidden></span>
          <span id="theme-slot"></span>
        </div>
      </div>
      <h1 class="shop-name display" id="shop-name"><span class="skeleton sk-title"></span></h1>
      <p class="tagline" id="shop-tagline"><span class="skeleton sk-line"></span></p>
      <div class="hero-meta">
        <span class="status-pill" id="status-pill" hidden></span>
        <span class="live-pill" id="live-pill" role="status" hidden></span>
      </div>
    </div>
  </header>

  <div class="announcement" id="announcement" role="status" hidden></div>

  <main id="menu" tabindex="-1">
    <section class="rail-section" id="fresh" aria-labelledby="fresh-title" hidden>
      <h2 class="rail-title display" id="fresh-title">Fresh right now <span aria-hidden="true">🔥</span></h2>
      <div class="rail" id="fresh-rail"></div>
    </section>

    <section class="rail-section" id="popular" aria-labelledby="popular-title" hidden>
      <h2 class="rail-title display" id="popular-title">Popular today <span aria-hidden="true">⭐</span></h2>
      <div class="rail" id="popular-rail"></div>
    </section>

    <div class="toolbar" id="toolbar">
      <div class="toolbar-inner">
        <div class="search">
          <label class="sr-only" for="search">Search the menu</label>
          <svg class="icon search-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input class="input search-input" id="search" type="search" placeholder="Search chai, snacks…" autocomplete="off" enterkeyhint="search">
          <button class="search-clear" id="search-clear" type="button" aria-label="Clear search" hidden>
            <svg class="icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
        </div>
        <nav class="chip-row" id="category-chips" aria-label="Menu categories"></nav>
      </div>
    </div>

    <div class="filters" id="filters" role="group" aria-label="Filters">
      <button type="button" class="chip filter-chip" data-filter="veg" aria-pressed="false"><span class="veg-mark is-veg" aria-hidden="true"></span>Veg only</button>
      <button type="button" class="chip filter-chip" data-filter="available" aria-pressed="false"><span aria-hidden="true">✅</span>Available now</button>
      <button type="button" class="chip filter-chip" data-filter="best" aria-pressed="false"><span aria-hidden="true">⭐</span>Bestsellers</button>
    </div>

    <div id="sections" class="sections" aria-live="off">
      <!-- Skeleton shown until the menu arrives -->
      <div class="sk-section" aria-hidden="true">
        <span class="skeleton sk-heading"></span>
        <div class="sk-card"><div class="sk-lines"><span class="skeleton sk-line w60"></span><span class="skeleton sk-line w90"></span><span class="skeleton sk-line w30"></span></div><span class="skeleton sk-thumb"></span></div>
        <div class="sk-card"><div class="sk-lines"><span class="skeleton sk-line w50"></span><span class="skeleton sk-line w80"></span><span class="skeleton sk-line w30"></span></div><span class="skeleton sk-thumb"></span></div>
        <div class="sk-card"><div class="sk-lines"><span class="skeleton sk-line w70"></span><span class="skeleton sk-line w90"></span><span class="skeleton sk-line w30"></span></div><span class="skeleton sk-thumb"></span></div>
      </div>
      <p class="sr-only" role="status">Loading the menu…</p>
    </div>
    <div id="menu-empty" hidden></div>
  </main>

  <footer class="menu-footer">
    <p class="footer-cta display">Order &amp; pay at the counter <span aria-hidden="true">🙏</span></p>
    <p class="footer-hours" id="footer-hours"></p>
    <p class="footer-powered">Powered by <strong>ChaiMenu</strong> · <a class="footer-owner" href="admin/">Owner login</a></p>
  </footer>

  <button type="button" class="picks-pill" id="picks-pill" hidden></button>

  <noscript><p class="config-banner">Please enable JavaScript to see the live menu.</p></noscript>
  <script type="module" src="js/menu/app.js"></script>
</body>
</html>
